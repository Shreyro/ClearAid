# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  # API: the backend Docker image
  - type: web
    name: clearaid-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # persistent disks need a paid instance; use "free" without the disk for a throwaway demo
    healthCheckPath: /healthz
    disk:
      name: clearaid-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PARTNER_CLIENT_ID
        sync: false
      - key: PAYPAL_PARTNER_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_PARTNER_WEBHOOK_ID
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        sync: false
      - key: PLAID_REDIRECT_URI # https://<clearaid-web>/oauth/plaid
        sync: false
      - key: PLAID_WEBHOOK_URL # https://<clearaid-api>/api/plaid/webhook
        sync: false
      # The hosted version has no AI: every AI feature and the Copilot are off. Run the code on your own machine (RENDER_MODE unset or NO) to use them.
      - key: RENDER_MODE
        value: "YES"
      - key: APP_URL # the clearaid-web URL (PayPal return URLs, links in outbound webhooks)
        sync: false

  # UI: Next.js, proxies /api/* to the API
  - type: web
    name: clearaid-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL # the clearaid-api URL, e.g. https://clearaid-api.onrender.com (needed at build time)
        sync: false
