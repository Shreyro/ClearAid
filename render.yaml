# Render Blueprint: https://render.com/docs/blueprint-spec
# The search service's password, shared by the API and the AI service (Render generates it once).
envVarGroups:
  - name: clearaid-ai-shared
    envVars:
      - key: RAG_TOKEN
        generateValue: true
      - key: COPILOT_MODEL # the API asks for it, the AI service downloads it. the small 3B model keeps the AI service on an 8 GB plan; llama3.1:8b is more accurate but needs 16 GB (plan pro max)
        value: llama3.2:3b

services:
  # API: the backend Docker image
  - type: web
    name: clearaid-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # persistent disks need a paid instance; use "free" without the disk for a throwaway demo
    healthCheckPath: /healthz
    disk:
      name: clearaid-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PARTNER_CLIENT_ID
        sync: false
      - key: PAYPAL_PARTNER_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_PARTNER_WEBHOOK_ID
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        sync: false
      - key: PLAID_REDIRECT_URI # https://<clearaid-web>/oauth/plaid
        sync: false
      - key: PLAID_WEBHOOK_URL # https://<clearaid-api>/api/plaid/webhook
        sync: false
      # The AI runs on clearaid-ai (below). The backend suspends it when idle and wakes it on the next question.
      - key: LOCAL_AI
        value: "on"
      - key: AI_HOST
        fromService:
          type: pserv
          name: clearaid-ai
          property: host
      - key: AI_IDLE_MINUTES
        value: "10"
      - key: RENDER_API_KEY # Render dashboard > Account Settings > API Keys
        sync: false
      - key: RENDER_AI_SERVICE_ID # the srv-... id of clearaid-ai (in its URL)
        sync: false
      - fromGroup: clearaid-ai-shared
      - key: APP_URL # the clearaid-web URL (PayPal return URLs, links in outbound webhooks)
        sync: false

  # UI: Next.js, proxies /api/* to the API
  - type: web
    name: clearaid-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL # the clearaid-api URL, e.g. https://clearaid-api.onrender.com (needed at build time)
        sync: false

  # AI: Ollama (Llama chat + embeddings) and the FAISS/OCR search service in one private service.
  # Big and billed by the hour, so the API suspends it after AI_IDLE_MINUTES without use.
  - type: pserv
    name: clearaid-ai
    runtime: docker
    rootDir: .
    dockerfilePath: ./ai/Dockerfile
    dockerContext: .
    plan: pro plus # 8 GB RAM is enough for llama3.2:3b, the embedding model and OCR; check the name and price in the Render dashboard
    disk:
      name: clearaid-ai-data
      mountPath: /data
      sizeGB: 20 # the models (about 6 GB) and the search index
    envVars:
      - key: EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_KEEP_ALIVE
        value: 30m
      - fromGroup: clearaid-ai-shared
