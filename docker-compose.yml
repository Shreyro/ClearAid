# ClearAid, the whole stack:
#
#   web      Next.js UI, the only service published to the host. It proxies /api/* to the API.
#   backend  Hono API + JSON store (volume clearaid-data).
#   rag      FAISS retrieval service for the Copilot (volume clearaid-rag).
#   ollama   Local models: embeddings for rag, Llama for everything else (volume clearaid-models).
#   models   One-shot jobs that pull the models into the ollama volume.
#   tunnel   Optional public HTTPS address (Cloudflare quick tunnel) for webhooks and bank logins.
#
# Start:   docker compose up -d --build        then open http://localhost:3000
# Logs:    docker compose logs -f backend rag
# Stop:    docker compose down                 (data stays in the volumes; add -v to wipe it)
# With a public address: node scripts/prod-local.mjs   (starts the tunnel and wires its URL in)
#
# Settings come from ./.env (copy .env.example) and API keys from ./backend/.env.
# Profiles (COMPOSE_PROFILES in .env): "ollama" runs Ollama in a container and
# downloads the models (~10 GB); leave it out and set OLLAMA_URL to use an
# Ollama already running on the host. "tunnel" adds the public address.

name: clearaid

x-ollama-image: &ollama-image ollama/ollama:${OLLAMA_VERSION:-0.40.16}

services:
  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    image: clearaid-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped

  backend:
    build: ./backend
    image: clearaid-backend
    env_file:
      - path: ./backend/.env # PayPal and Plaid keys (optional)
        required: false
    environment:
      # These always win over backend/.env, which is written for running on the host.
      DATA_DIR: /data
      PORT: "4000"
      HOST: 0.0.0.0
      APP_URL: ${PUBLIC_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-} # empty: a random one is generated once and kept in the data volume
      # Banks that log in on their own site return to PUBLIC_URL/oauth/plaid; Plaid's webhooks go to PUBLIC_URL/api/plaid/webhook.
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI:-}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
      # The ollama container, or an Ollama on the host (http://host.docker.internal:11434).
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      COPILOT_MODEL: ${COPILOT_MODEL:-llama3.1:8b}
      LOCAL_VISION_MODEL: ${LOCAL_VISION_MODEL:-llava}
      RAG_URL: http://rag:8790
      RAG_TOKEN: ${RAG_TOKEN:-}
    volumes:
      - clearaid-data:/data
    depends_on:
      rag:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  rag:
    build: ./rag
    image: clearaid-rag
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      RAG_TOKEN: ${RAG_TOKEN:-}
      OCR_GPU: "0"
    volumes:
      - clearaid-rag:/index
    depends_on:
      # Only when the "ollama" profile runs Ollama in a container.
      ollama:
        condition: service_healthy
        required: false
      models-embed:
        condition: service_completed_successfully
        required: false
    networks: [internal]
    restart: unless-stopped

  ollama:
    image: *ollama-image
    profiles: [ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 30m # keep the chat model loaded between questions
    volumes:
      - clearaid-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks: [internal]
    restart: unless-stopped
    # NVIDIA GPU (Linux host with the NVIDIA Container Toolkit): uncomment for much faster answers.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Small (~270 MB): search needs it, so rag waits for it.
  models-embed:
    image: *ollama-image
    profiles: [ollama]
    entrypoint: ["ollama", "pull", "${EMBED_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  # Large (~4.9 GB): nothing waits for it. Watch with: docker compose logs -f models-chat
  models-chat:
    image: *ollama-image
    profiles: [ollama]
    entrypoint: ["ollama", "pull", "${COPILOT_MODEL:-llama3.1:8b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  # Only for reading receipt and photo images. Nothing waits for it either.
  models-vision:
    image: *ollama-image
    profiles: [ollama]
    entrypoint: ["ollama", "pull", "${LOCAL_VISION_MODEL:-llava}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  # A public HTTPS address for the UI (and, through it, the API): PayPal and
  # Plaid webhooks and banks that log in on their own site need one. A quick
  # tunnel's address changes on every start; scripts/prod-local.mjs reads it
  # and sets PUBLIC_URL and the Plaid URLs. For a fixed address, use a named
  # Cloudflare tunnel or a real host instead.
  tunnel:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.5}
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    networks: [edge]
    restart: unless-stopped

networks:
  # Only the UI sits on the edge network with a published port.
  edge: {}
  # The API, rag and ollama talk to each other here and are never published.
  # Not "internal: true": the API calls PayPal and Plaid, and ollama
  # downloads models, so both need the internet.
  internal: {}

volumes:
  clearaid-data: # db.json, uploads, the session secret
  clearaid-rag: # FAISS indexes + embedding cache
  clearaid-models: # Ollama models
