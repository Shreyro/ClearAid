# Backend API in Docker. Run the frontend with `npm run dev` in ./frontend
# (it proxies /api/* to BACKEND_URL, default http://localhost:4000).
services:
  backend:
    build: ./backend
    image: clearaid-backend
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATA_DIR: /data # always the volume, whatever backend/.env says
      PORT: "4000"
    volumes:
      - clearaid-data:/data
    restart: unless-stopped

volumes:
  clearaid-data:
